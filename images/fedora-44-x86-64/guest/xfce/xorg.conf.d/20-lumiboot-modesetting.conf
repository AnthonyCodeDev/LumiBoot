# Xorg configuration for v64, whose only display device is the emulated Bochs VGA.
#
# Fedora 41+ retired the xorg-x11-drv-vesa and xorg-x11-drv-fbdev packages, so
# there is no VBE/fbdev driver left: the bochs-drm KMS device (kernel-modules)
# plus the modesetting driver are the only path to a framebuffer. Glamor would
# need EGL on a real GPU, so acceleration stays off: a 2D XFCE session is enough
# and it is far cheaper under software emulation.
Section "Device"
  Identifier "lumiboot-modesetting"
  Driver "modesetting"
  Option "AccelMethod" "none"
EndSection

# AZERTY keyboard in X, matching the fr console keymap of /etc/vconsole.conf.
Section "InputClass"
  Identifier "lumiboot-keyboard"
  MatchIsKeyboard "on"
  Option "XkbModel" "pc105"
  Option "XkbLayout" "fr"
EndSection
