# Xorg configuration for v64, whose only display device is the emulated Bochs VGA.
#
# udev loads bochs.ko, so the DRM/KMS device exists before X and the modesetting
# driver is the primary path (lumiboot-startx tries it first). fbdev on /dev/fb0
# is the fallback and the reason both layouts exist. Glamor would need EGL on a
# real GPU: acceleration stays off, a 2D XFCE session is enough and much cheaper
# under software emulation.

Section "Device"
    Identifier "lumiboot-modesetting"
    Driver     "modesetting"
    Option     "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier "lumiboot-monitor"
    HorizSync 31-80
    VertRefresh 50-75
EndSection

Section "Screen"
    Identifier "lumiboot-ms-screen"
    Device     "lumiboot-modesetting"
    Monitor    "lumiboot-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "LumiBootModesetting"
    Screen     0 "lumiboot-ms-screen"
EndSection

Section "Device"
    Identifier "lumiboot-fb"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "lumiboot-fb-screen"
    Device     "lumiboot-fb"
    Monitor    "lumiboot-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "LumiBootFBDev"
    Screen     0 "lumiboot-fb-screen"
EndSection

# The keyboard is a libinput device discovered through udev: only the layout and
# the model are set here, matching the fr AZERTY console keymap.
Section "InputClass"
    Identifier "lumiboot-keyboard"
    MatchIsKeyboard "on"
    Option     "XkbModel" "pc105"
    Option     "XkbLayout" "fr"
EndSection
