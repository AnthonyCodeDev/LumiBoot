# Configuration Xorg minimale pour v86 (flavor desktop).
#
# Sous v86 la carte vidéo est un adaptateur VGA compatible VBE, sans pilote DRM
# exploitable (le module « bochs » est volontairement blacklisté pour préserver
# le mode texte de la console). On force donc le pilote X « vesa » (VBE via le
# BIOS) et on laisse « fbdev » disponible en repli si un framebuffer existe.
Section "Device"
    Identifier  "LumiBootVGA"
    Driver      "vesa"
EndSection

Section "Screen"
    Identifier  "LumiBootScreen"
    Device      "LumiBootVGA"
    DefaultDepth 16
EndSection

Section "ServerLayout"
    Identifier  "LumiBootLayout"
    Screen      "LumiBootScreen"
EndSection
