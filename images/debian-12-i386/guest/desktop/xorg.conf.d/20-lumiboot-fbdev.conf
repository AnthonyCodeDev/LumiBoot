# Configuration Xorg pour v86 (flavor desktop) — pilotes compatibles KMS/framebuffer.
#
# Sous v86, le noyau attache un pilote KMS « bochs-drm » au périphérique
# graphique et expose une console framebuffer (« bochs-drmdrmfb », /dev/fb0).
# Un pilote qui revendique directement le matériel VBE (comme « vesa ») REFUSE
# alors de s'attacher — « vesa: Ignoring device with a bound kernel driver » —
# et X échoue avec « no screens found ». On n'utilise donc PLUS « vesa ».
#
# Deux ServerLayout sont définis et sélectionnés par
# /usr/local/bin/lumiboot-startx :
#
#   * « LumiBootFBDev »       — primaire : pilote « fbdev » sur le framebuffer
#     noyau /dev/fb0 fourni par « bochs-drm » (aucun accès aux ports d'E/S).
#   * « LumiBootModesetting » — repli : pilote « modesetting » (fourni par
#     xserver-xorg-core), qui pilote directement le KMS « bochs-drm ».

# --- Primaire : fbdev (framebuffer noyau /dev/fb0) ---------------------------
Section "Device"
    Identifier "lumiboot-fb"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "lumiboot-monitor"
    HorizSync 31-80
    VertRefresh 50-75
EndSection

Section "Screen"
    Identifier "lumiboot-screen"
    Device     "lumiboot-fb"
    Monitor    "lumiboot-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "LumiBootFBDev"
    Screen     0 "lumiboot-screen"
EndSection

# --- Repli : modesetting (KMS bochs-drm, fourni par xserver-xorg-core) --------
Section "Device"
    Identifier "lumiboot-modesetting"
    Driver     "modesetting"
EndSection

Section "Screen"
    Identifier "lumiboot-ms-screen"
    Device     "lumiboot-modesetting"
    Monitor    "lumiboot-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "LumiBootModesetting"
    Screen     0 "lumiboot-ms-screen"
EndSection
