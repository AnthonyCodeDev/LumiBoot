# Xorg configuration for v86 (desktop AND xfce flavors) — KMS/framebuffer-compatible drivers.
#
# File SHARED by both graphical flavors (desktop/Openbox and xfce): no
# duplication, installed at the same location in both images.
#
# Under v86, the kernel attaches a "bochs-drm" KMS driver to the graphics device
# and exposes a framebuffer console ("bochs-drmdrmfb", /dev/fb0). A driver that
# claims the VBE hardware directly (such as "vesa") then REFUSES to attach --
# "vesa: Ignoring device with a bound kernel driver" -- and X fails with
# "no screens found". "vesa" is therefore NO LONGER used.
#
# Two ServerLayouts are defined and selected by
# /usr/local/bin/lumiboot-startx :
#
#   * "LumiBootFBDev"       -- primary: "fbdev" driver on the kernel framebuffer
#     /dev/fb0 provided by "bochs-drm" (no access to I/O ports).
#   * "LumiBootModesetting" -- fallback: "modesetting" driver (provided by
#     xserver-xorg-core), which drives the "bochs-drm" KMS directly.

# --- Primary: fbdev (kernel framebuffer /dev/fb0) ---------------------------
Section "Device"
    Identifier "lumiboot-fb"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "lumiboot-monitor"
    HorizSync 31-80
    VertRefresh 50-75
EndSection

Section "Screen"
    Identifier "lumiboot-screen"
    Device     "lumiboot-fb"
    Monitor    "lumiboot-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "LumiBootFBDev"
    Screen     0 "lumiboot-screen"
EndSection

# --- Fallback: modesetting (bochs-drm KMS, provided by xserver-xorg-core) -----
Section "Device"
    Identifier "lumiboot-modesetting"
    Driver     "modesetting"
EndSection

Section "Screen"
    Identifier "lumiboot-ms-screen"
    Device     "lumiboot-modesetting"
    Monitor    "lumiboot-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "LumiBootModesetting"
    Screen     0 "lumiboot-ms-screen"
EndSection
