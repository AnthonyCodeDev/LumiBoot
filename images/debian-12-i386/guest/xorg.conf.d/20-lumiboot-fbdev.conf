# Xorg configuration for v86: KMS and framebuffer compatible drivers.
#
# Under v86 the kernel binds a bochs-drm KMS driver, so vesa refuses to attach and
# X fails with "no screens found". fbdev on /dev/fb0 is primary, modesetting the
# fallback; lumiboot-startx selects the layout.

Section "Device"
    Identifier "lumiboot-fb"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "lumiboot-monitor"
    HorizSync 31-80
    VertRefresh 50-75
EndSection

Section "Screen"
    Identifier "lumiboot-screen"
    Device     "lumiboot-fb"
    Monitor    "lumiboot-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "LumiBootFBDev"
    Screen     0 "lumiboot-screen"
EndSection

Section "Device"
    Identifier "lumiboot-modesetting"
    Driver     "modesetting"
EndSection

Section "Screen"
    Identifier "lumiboot-ms-screen"
    Device     "lumiboot-modesetting"
    Monitor    "lumiboot-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "LumiBootModesetting"
    Screen     0 "lumiboot-ms-screen"
EndSection
