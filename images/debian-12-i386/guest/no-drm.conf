# Reste en mode texte VGA (vgacon) sous v86 : sans ceci, le pilote DRM
# `bochs` bascule la console vers un framebuffer (fbcon 128x48) et
# l'élément `.v86-screen-text` (mode texte) reste figé sur les logs de
# boot, rendant l'autologin tty1 invérifiable en mode texte.
# (Le module s'appelle `bochs` dans lsmod, pas `bochs_drm`.)
# `blacklist` seul n'empêche pas un chargement explicite : `install`
# neutralise tout chargement (udev/modalias comme manuel).
blacklist bochs
install bochs /bin/false
