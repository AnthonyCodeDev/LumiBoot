# Stays in text VGA mode (vgacon) under v86: without this, the `bochs` DRM
# driver switches the console to a framebuffer (fbcon 128x48) and the
# `.v86-screen-text` element (text mode) freezes on the boot logs, making the
# tty1 autologin impossible to verify in text mode.
# (The module is called `bochs` in lsmod, not `bochs_drm`.)
# `blacklist` alone does not prevent an explicit load: `install` neutralizes any
# load (udev/modalias as well as manual).
blacklist bochs
install bochs /bin/false
