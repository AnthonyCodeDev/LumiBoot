# Keeps the text VGA console under v86: bochs-drm would switch to fbcon and
# freeze the text-mode checks.
# Linux 4.15 (bionic) ships the driver as `bochs-drm.ko` (module `bochs_drm`),
# renamed to `bochs` in 4.20+: both names are neutralized.
# `install` neutralizes any load, which `blacklist` alone does not.
blacklist bochs_drm
install bochs_drm /bin/false
blacklist bochs
install bochs /bin/false
