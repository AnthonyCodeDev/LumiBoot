# Docker Compose de développement — LumiBoot
#
# Lot 0 : seul le service `web` est pertinent. Les services `api` et `db`
# appartiennent à des lots futurs et sont laissés en commentaire
# car aucun backend n'est requis pour exécuter un Debian local via v86.
#
# Usage : docker compose -f infra/dev/docker-compose.yml up web

services:
  web:
    image: node:22-bookworm
    working_dir: /work
    command: sh -lc "corepack enable && pnpm install && pnpm --filter @lumiboot/web dev --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - ../..:/work
      - lumiboot_node_modules:/work/node_modules

volumes:
  lumiboot_node_modules:
