  #   working_dir: /work
  #   command: sh -lc "corepack enable && pnpm install && pnpm --filter @lumiboot/api start"
  #   environment:
  #     DATABASE_URL: postgres://lumiboot:lumiboot@db:5432/lumiboot
  #   depends_on: [db]
  #
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: lumiboot
  #     POSTGRES_PASSWORD: lumiboot
  #     POSTGRES_DB: lumiboot
