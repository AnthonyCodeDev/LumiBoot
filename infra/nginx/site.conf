server {
    listen 80;
    server_name lumiboot.example;

    # Servir le build statique de apps/web (apps/web/dist)
    root /usr/share/nginx/html/lumiboot;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # Application SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets immuables
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Logos locaux (aucun CDN d'illustrations)
    location /icons/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Aucune API ni console distante : tout le runtime reste local au navigateur.
}
