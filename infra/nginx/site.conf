server {
    listen 80;
    server_name lumiboot.example;

    # Servir le build statique de apps/web (apps/web/dist)
    root /usr/share/nginx/html/lumiboot;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # Application SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets immuables
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Logos locaux (aucun CDN d'illustrations)
    location /icons/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Binaires du moteur v86 (WASM + BIOS). JAMAIS de fallback SPA : un 404 est
    # un vrai 404, sinon v86 recevrait index.html et échouerait silencieusement.
    location /v86/ {
        include /etc/nginx/conf.d/security-headers.conf;
        types {
            application/wasm wasm;
            application/octet-stream bin;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges "bytes" always;
        gzip off;
        try_files $uri =404;
    }

    # Images disque des systèmes : téléchargées par v86 via HTTP Range.
    # Aucune compression (elle casserait les requêtes Range), pas de fallback SPA.
    location /images/ {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges "bytes" always;
        gzip off;
        try_files $uri =404;
    }
}
