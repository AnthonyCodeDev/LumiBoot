server {
    listen 80;
    server_name lumiboot.example;

    # Static build of apps/web.
    root /usr/share/nginx/html/lumiboot;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        # `add_header` is only inherited when the block declares none.
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Exact match, no SPA fallback: a missing file is a real 404.
    location = /lumiboot.config.json {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # WASM/BIOS: never fall back to the SPA, otherwise v86 receives index.html.
    location /v86/ {
        include /etc/nginx/conf.d/security-headers.conf;
        types {
            application/wasm wasm;
            application/octet-stream bin;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges "bytes" always;
        gzip off;
        try_files $uri =404;
    }

    # Static files: real 404, `Accept-Ranges` for resume, gzip off so 206 responses stay intact.
    location /downloads/ {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges "bytes" always;
        gzip off;
        autoindex off;
        try_files $uri =404;
    }

    # Fresh JSON, never index.html.
    location = /downloads/manifest.json {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Free disks (Debian) read by v86 over HTTP Range: gzip off, no fallback, no autoindex.
    location /images/ {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges "bytes" always;
        gzip off;
        autoindex off;
        try_files $uri =404;
    }

    # 404 for proprietary media under /images/, even when copied into the webroot by mistake.
    location ~* "^/images/.*(windows|winxp|winvista|win[0-9])" {
        return 404;
    }
}
