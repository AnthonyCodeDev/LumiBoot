server {
    listen 80;
    server_name lumiboot.example;

    # Servir le build statique de apps/web (apps/web/dist)
    root /usr/share/nginx/html/lumiboot;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # Application SPA
    # `add_header` n'est hérité que tant que le bloc n'en définit aucun :
    # on inclut explicitement la sécurité pour ne pas dépendre de ce subtil.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Fichier de configuration runtime de l'UI. Correspondance EXACTE (priorité
    # sur le préfixe `/`) et AUCUN fallback SPA : s'il manque, c'est un vrai 404,
    # jamais index.html (sinon l'UI parserait du HTML comme du JSON).
    location = /lumiboot.config.json {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Assets immuables
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Logos locaux (aucun CDN d'illustrations)
    location /icons/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Binaires du moteur v86 (WASM + BIOS). JAMAIS de fallback SPA : un 404 est
    # un vrai 404, sinon v86 recevrait index.html et échouerait silencieusement.
    location /v86/ {
        include /etc/nginx/conf.d/security-headers.conf;
        types {
            application/wasm wasm;
            application/octet-stream bin;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges "bytes" always;
        gzip off;
        try_files $uri =404;
    }

    # Téléchargements du « LumiBoot Network Proxy » (binaires + manifeste).
    # STRICTEMENT statique : AUCUN fallback SPA. Un fichier absent renvoie un vrai
    # 404, jamais index.html (l'UI parserait sinon du HTML comme un binaire/JSON).
    # `Accept-Ranges: bytes` est nécessaire pour reprendre un téléchargement
    # interrompu (`Range`), et l'absence de compression est volontaire pour ne
    # pas casser les réponses 206.
    location /downloads/ {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        add_header Accept-Ranges "bytes" always;
        gzip off;
        autoindex off;
        try_files $uri =404;
    }

    # Manifeste de disponibilité des téléchargements : JSON frais (no-store),
    # toujours un vrai 404 si absent (jamais index.html).
    location = /downloads/manifest.json {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Images disque des systèmes LIBRES (Debian) : téléchargées par v86 via HTTP
    # Range. Aucune compression (elle casserait les requêtes Range), pas de
    # fallback SPA, pas d'index de répertoire.
    #
    # INTERDIT dans ce webroot : images Windows propriétaires (Windows 7/XP/10…)
    # et médias utilisateur. Ces disques vivent hors `public/` (servis en
    # développement par le middleware Vite in-place) et ne doivent JAMAIS être
    # copiés dans le build publié. Le garde-fou CI (`tests/webroot-assets.test.ts`)
    # échoue si un tel média y apparaît ; le bloc `~* ^/images/...windows...`
    # ci-dessous est la double barrière côté serveur (404 explicite).
    location /images/ {
        include /etc/nginx/conf.d/security-headers.conf;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges "bytes" always;
        gzip off;
        autoindex off;
        try_files $uri =404;
    }

    # Refus explicite (404) des médias système propriétaires sous /images/, même
    # si un fichier était déposé par erreur dans le webroot. Les regex ont la
    # priorité sur le préfixe `/images/` ci-dessus. Volontairement limité aux
    # noms de systèmes propriétaires : les images libres (Debian…) restent
    # servies normalement.
    location ~* "^/images/.*(windows|winxp|winvista|win[0-9])" {
        return 404;
    }
}
