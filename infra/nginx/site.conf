server {
    listen 80;
    server_name lumiboot.example;

    # Servir le build statique de apps/web (apps/web/dist)
    root /usr/share/nginx/html/lumiboot;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # Application SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets immuables
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Logos locaux (aucun CDN d'illustrations)
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # API distante (Lot 4) — ne jamais proxyfier un port VNC/RDP/QEMU public.
    # location /api/ {
    #     proxy_pass http://api:8787/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Console distante via passerelle authentifiée (Lot 4).
    # location /console/ {
    #     proxy_pass http://guacamole:8080/;   # ticket courte durée requis
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }
}
