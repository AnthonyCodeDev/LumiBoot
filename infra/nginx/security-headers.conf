# En-têtes de sécurité (à inclure dans le bloc server Nginx).
#
# ATTENTION WASM : v86 peut nécessiter SharedArrayBuffer selon la version
# intégrée, ce qui exige une isolation cross-origin (COOP/COEP) et des en-têtes
# compatibles avec les workers de l'émulateur. À valider au Lot 1 avant de
# généraliser ; ne pas activer COEP tant que les assets ne sont pas prêts.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Décommenter uniquement si la version de v86 intégrée requiert SharedArrayBuffer,
# et servir tous les assets avec CORP: cross-origin.
# add_header Cross-Origin-Embedder-Policy "require-corp" always;
# add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content-Security-Policy : à restreindre progressivement. wasm-unsafe-eval est
# requis pour WebAssembly. Adapter les domaines à l'hébergement réel.
#
# `connect-src` doit couvrir les transports réseau de v86 (cf.
# packages/provider-v86/src/network/V86NetworkAdapter.ts) :
#   - 'self'  : assets et API servis par LumiBoot lui-même ;
#   - https:  : le mode « browser-fetch » émet ses requêtes vers des ORIGINES
#     HTTPS VARIABLES (contactées par le pilote réseau de l'invité), qu'il est
#     impossible d'énumérer à l'avance. On autorise donc le schéma ENTIER.
#   - wss:    : relais WISP personnel (mode « user-relay »), dont l'hôte/port
#     `wss://` est fourni à l'exécution par l'utilisateur.
#
# Quand le relais WISP de confiance est connu d'avance, le resserrement attendu
# est : remplacer `wss:` par l'origine exacte (ex. `wss://wisp.example.com:8443`)
# et, si le produit fixe un backend fetch connu, remplacer `https:` par cette
# liste d'origines. Tant que ce n'est pas le cas, la CSP n'est plus une
# allow-list réseau mais une simple garde anti-injection : `https:`/`wss:`
# autorisent n'importe quel hôte de ce schéma. Risque assumé et à resserrer dès
# que le profil réseau est figé.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https: wss:; worker-src 'self' blob:; frame-ancestors 'none'" always;
