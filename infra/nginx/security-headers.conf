# Include in every `location`: `add_header` is only inherited when the block declares none.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Required by v64 parallel vCPU Workers. Cross-origin media must opt into CORS.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# `wasm-unsafe-eval` and `worker-src blob:` are required by the v86 emulator.
# connect-src lists exact origins, never `*`: the local proxy listens on 37892.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' http://127.0.0.1:37892 ws://127.0.0.1:37892 http://localhost:37892 ws://localhost:37892; worker-src 'self' blob:; frame-ancestors 'none'" always;
