# En-têtes de sécurité (à inclure dans le bloc server Nginx).
#
# ATTENTION WASM : v86 peut nécessiter SharedArrayBuffer selon la version
# intégrée, ce qui exige une isolation cross-origin (COOP/COEP) et des en-têtes
# compatibles avec les workers de l'émulateur. À valider au Lot 1 avant de
# généraliser ; ne pas activer COEP tant que les assets ne sont pas prêts.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Décommenter uniquement si la version de v86 intégrée requiert SharedArrayBuffer,
# et servir tous les assets avec CORP: cross-origin.
# add_header Cross-Origin-Embedder-Policy "require-corp" always;
# add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content-Security-Policy : à restreindre progressivement. wasm-unsafe-eval est
# requis pour WebAssembly. Adapter les domaines à l'hébergement réel.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'" always;
