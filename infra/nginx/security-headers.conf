# En-têtes de sécurité (à inclure dans le bloc server Nginx, et dans chaque
# `location` — `add_header` n'est hérité que tant que le bloc n'en définit aucun).
#
# ATTENTION WASM : v86 peut nécessiter SharedArrayBuffer selon la version
# intégrée, ce qui exige une isolation cross-origin (COOP/COEP) et des en-têtes
# compatibles avec les workers de l'émulateur. À valider au Lot 1 avant de
# généraliser ; ne pas activer COEP tant que les assets ne sont pas prêts.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# COEP/CORP requis par v86 WASM si SharedArrayBuffer est nécessaire : à
# décommenter quand TOUS les assets sont servis avec CORP: cross-origin (sinon
# la page elle-même serait bloquée). COOP ci-dessus est déjà en place, ce qui
# est la moitié de l'isolation cross-origin.
# add_header Cross-Origin-Embedder-Policy "require-corp" always;
# add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content-Security-Policy.
#
# `wasm-unsafe-eval` est requis pour WebAssembly (v86). `worker-src blob:` est
# requis par l'émulateur. Les CSS/polices Google sont les seuls assets tiers.
#
# `connect-src` est une ALLOW-LIST D'ORIGINES EXACTES — jamais `*`, jamais un
# `https:`/`wss:` global (qui n'offrirait qu'une garde anti-injection, en
# autorisant n'importe quel hôte de ce schéma) :
#
#   - 'self'  : assets, API et config servis par LumiBoot lui-même ;
#   - le **proxy réseau local** (mode `local-proxy`, chemin 1-clic) écoute sur
#     loopback à `127.0.0.1:37892` (voir
#     packages/vm-network/src/proxy.ts → DEFAULT_PROXY_URL). La page interroge
#     `http://…/health`, `/api/…` ET ouvre la WebSocket `ws://…/wisp/` : les
#     DEUX schémas `http:` et `ws:` doivent donc figurer explicitement, pour
#     l'adresse `127.0.0.1` ET l'alias `localhost` (tous deux acceptés par
#     `validateProxyUrl`). Si le déploiement change ce port, adapter les
#     origines ici — jamais par un wildcard.
#   - `[::1]` (loopback IPv6) : à ajouter explicitement si un déploiement
#     configure le proxy sur `::1` (`http://[::1]:37892 ws://[::1]:37892`).
#
# Modes NON par défaut (`user-relay`, `browser-fetch`) : leurs origines ne sont
# connues qu'À L'EXÉCUTION (relais WISP fourni par l'utilisateur ; hôtes HTTPS
# arbitraires contactés par le pilote réseau de l'invité) et ne peuvent donc pas
# être énumérées à la compilation. Pour les activer, AJOUTER les origines
# EXACTES du déploiement, par exemple :
#   connect-src 'self' http://127.0.0.1:37892 ws://127.0.0.1:37892 \
#               wss://wisp.example.org:8443 https://api.exemple.internal ;
# Ne JAMAIS revenir à `https:`/`wss:` seuls ni à `*` : documenter plutôt
# l'origine fixée par déploiement. (Rappel : `browser-fetch` ne transporte que
# le port 80 HTTP sous CORS — HTTPS y échoue déjà côté v86 0.5.471.)
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' http://127.0.0.1:37892 ws://127.0.0.1:37892 http://localhost:37892 ws://localhost:37892; worker-src 'self' blob:; frame-ancestors 'none'" always;
