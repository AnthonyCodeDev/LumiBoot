# Include in every `location`: `add_header` is only inherited when the block declares none.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# COEP/CORP: uncomment only if ALL assets are served with CORP: cross-origin.
# add_header Cross-Origin-Embedder-Policy "require-corp" always;
# add_header Cross-Origin-Resource-Policy "same-origin" always;

# `wasm-unsafe-eval` (v86 WASM) and `worker-src blob:` are required by the emulator.
# connect-src: exact origins, never `*` or a blanket `https:`/`wss:`; the local proxy
# listens on 127.0.0.1:37892 over http AND ws (DEFAULT_PROXY_URL in packages/vm-network).
# `user-relay` and `browser-fetch`: add the exact origins of the deployment.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' http://127.0.0.1:37892 ws://127.0.0.1:37892 http://localhost:37892 ws://localhost:37892; worker-src 'self' blob:; frame-ancestors 'none'" always;
