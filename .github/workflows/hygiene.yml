name: Hygiene

# Hygiene guardrails, in a SINGLE job to limit the number of checks:
# Prettier formatting, v86 binary integrity (pinned SHA-256), no committed
# media/large files and no committed network client release binaries (those
# are published as GitHub Release assets). Complements `ci.yml` without
# duplicating it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Formatting (Prettier)
        run: pnpm format:check
      - name: v86 binary integrity (SHA-256)
        run: |
          pnpm assets:prepare
          pnpm assets:check
      - name: Committed media/archives (forbidden)
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(img|iso|qcow2?|vhd|vhdx|vmdk|vdi|ext[234])$'; then
            echo "::error::Disk/media images are committed; they must stay out of Git."
            exit 1
          fi
          # Release assets of the network client live in GitHub Releases only:
          # the repository tracks `manifest.json` and `SHA256SUMS`, never binaries.
          if git ls-files 'apps/web/public/downloads/*' | grep -Ei '\.(exe|tar\.gz|zip)$'; then
            echo "::error::Network client binaries are committed. Publish them as GitHub Release assets (see network-proxy.yml) and keep only manifest.json and SHA256SUMS in Git."
            exit 1
          fi
      - name: Large committed files (> 25 MiB)
        run: |
          set -euo pipefail
          offenders=""
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt 26214400 ]; then
              offenders="${offenders}${size}  ${f}\n"
            fi
          done < <(git ls-files)
          if [ -n "$offenders" ]; then
            printf '%b\n' "$offenders"
            echo "::error::Large committed files detected."
            exit 1
          fi
          echo "No committed file exceeds 25 MiB."
