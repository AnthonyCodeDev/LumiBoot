name: Hygiene

# Garde-fous de propreté, en UN job pour limiter le nombre de checks :
# formatage Prettier, intégrité des binaires v86 (SHA-256 épinglés) et absence
# de médias/fichiers volumineux versionnés. Complète `ci.yml` sans le dupliquer.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Propreté
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Installation
        run: pnpm install --frozen-lockfile
      - name: Formatage (Prettier)
        run: pnpm format:check
      - name: Intégrité binaires v86 (SHA-256)
        run: |
          pnpm assets:prepare
          pnpm assets:check
      - name: Médias/archives versionnés (interdits)
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(img|iso|qcow2?|vhd|vhdx|vmdk|vdi|ext[234])$'; then
            echo "::error::Des images disque/média sont versionnées ; elles doivent rester hors Git."
            exit 1
          fi
      - name: Gros fichiers versionnés (> 25 Mio, hors downloads publiés)
        run: |
          set -euo pipefail
          offenders=""
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt 26214400 ]; then
              case "$f" in
                apps/web/public/downloads/*) ;;
                *) offenders="${offenders}${size}  ${f}\n" ;;
              esac
            fi
          done < <(git ls-files)
          if [ -n "$offenders" ]; then
            printf '%b\n' "$offenders"
            echo "::error::Fichiers volumineux versionnés détectés."
            exit 1
          fi
          echo "Aucun fichier versionné au-delà de 25 Mio (hors downloads publiés)."
