name: Hygiene

# Garde-fous de propreté du dépôt, complémentaires de `ci.yml`
# (lint/typecheck/tests/build) : formatage Prettier, intégrité des binaires du
# moteur v86 (SHA-256 épinglés) et absence de médias/archives volumineux
# versionnés.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Formatage (Prettier)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  engine-assets:
    name: Intégrité binaires v86 (SHA-256)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Préparer puis vérifier (v86.wasm, seabios.bin, vgabios.bin)
        run: |
          pnpm assets:prepare
          pnpm assets:check

  repository:
    name: Propreté du dépôt (médias volumineux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Refuser les médias/archives versionnés
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(img|iso|qcow2?|vhd|vhdx|vmdk|vdi|ext[234])$'; then
            echo "::error::Des images disque/média sont versionnées ; elles doivent rester hors Git."
            exit 1
          fi
      - name: Refuser les gros fichiers versionnés (> 25 Mio, hors downloads publiés)
        run: |
          set -euo pipefail
          offenders=""
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt 26214400 ]; then
              case "$f" in
                apps/web/public/downloads/*) ;;
                *) offenders="${offenders}${size}  ${f}\n" ;;
              esac
            fi
          done < <(git ls-files)
          if [ -n "$offenders" ]; then
            printf '%b\n' "$offenders"
            echo "::error::Fichiers volumineux versionnés détectés."
            exit 1
          fi
          echo "Aucun fichier versionné au-delà de 25 Mio (hors downloads publiés)."
