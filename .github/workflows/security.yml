name: Security

# Scan de sécurité de la chaîne d'approvisionnement, en UN job pour limiter le
# nombre de checks : secrets versionnés (gitleaks, historique complet),
# vulnérabilités des dépendances livrées (pnpm audit) et vulnérabilités Go
# atteignables (govulncheck). Complète `ci.yml` sans le dupliquer.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Sécurité
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Secrets versionnés (gitleaks)
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --config .gitleaks.toml --redact --verbose
      - name: Dépendances livrées (pnpm audit)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
      - name: Vulnérabilités Go (govulncheck)
        working-directory: apps/network-proxy
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
