name: Security

# Supply-chain security scan, in a SINGLE job to limit the number of checks:
# committed secrets with gitleaks over the full history, vulnerabilities in
# shipped dependencies with pnpm audit, and reachable Go vulnerabilities with
# govulncheck. Complements `ci.yml` without duplicating it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: pnpm/action-setup@v6
        with:
          version: 9.14.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Committed secrets (gitleaks)
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --config .gitleaks.toml --redact --verbose
      - name: Shipped dependencies (pnpm audit)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
      - name: Go vulnerabilities (govulncheck)
        working-directory: apps/network-proxy
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
